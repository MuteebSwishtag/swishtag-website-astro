<style>
:root{
  --lime:#C2FF02;
  --peach:#FFBD9B;
  --lavender:#D9D6FD;
  --mint:#99FEED;
  --white:#FFFFFF;
  --gray:#F5F5F3;
  --graphite:#202124;
  --muted:#696A6D;
  --line:rgba(32,33,36,.12);
  --shadow:0 28px 80px rgba(32,33,36,.10);
  --radius-lg:36px;
  --radius-md:24px;
  --radius-sm:16px;
  --page:min(1320px,calc(100vw - 48px));
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#fff}
body{
  margin:0;color:var(--graphite);overflow-x:hidden;
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 88% 4%,rgba(217,214,253,.52),transparent 24%),
    radial-gradient(circle at 70% 15%,rgba(153,254,237,.34),transparent 28%),
    linear-gradient(180deg,#fff 0%,#fff 76%,#F8F8F5 100%);
}
body.mobile-menu-lock{overflow:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.page-shell{width:var(--page);margin-inline:auto}
.section{position:relative;padding:108px 0}
.section--tight{padding:82px 0}
.eyebrow{
  margin:0 0 18px;color:var(--muted);font-size:.78rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase
}
.section-title{
  margin:0;max-width:1000px;font-size:clamp(3rem,6vw,6.2rem);line-height:.98;
  letter-spacing:-.06em;font-weight:800
}
.section-copy{
  margin:28px 0 0;max-width:760px;color:var(--muted);
  font-size:clamp(1.03rem,1.45vw,1.3rem);line-height:1.68
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:13px;min-height:56px;
  padding:0 24px;border:1px solid transparent;border-radius:999px;
  font-size:.96rem;font-weight:700;white-space:nowrap;
  transition:transform .3s var(--ease),background .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease)
}
.btn:hover{transform:translateY(-3px)}
.btn--primary{background:var(--lime);box-shadow:0 10px 24px rgba(194,255,2,.26)}
.btn--secondary{border-color:var(--graphite);background:rgba(255,255,255,.86);backdrop-filter:blur(10px)}
.btn--dark{background:var(--graphite);color:#fff}
.text-link{display:inline-flex;align-items:center;gap:10px;margin-top:28px;font-weight:700}
.text-link .arrow{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:50%;background:var(--lime);transition:transform .3s var(--ease)}
.text-link:hover .arrow{transform:translateX(4px)}

/* Header */
.site-header{position:fixed;inset:0 0 auto;z-index:80;padding:18px 0;transition:background .3s ease,box-shadow .3s ease,padding .3s ease}
.site-header.is-scrolled{padding:10px 0;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);box-shadow:0 1px 0 var(--line)}
.modern-nav{
  width:var(--page);margin-inline:auto;min-height:64px;display:grid;
  grid-template-columns:auto 1fr auto auto;align-items:center;gap:22px;
  padding:0 8px 0 22px;border-radius:999px;background:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 42px rgba(32,33,36,.075),inset 0 1px 0 rgba(255,255,255,.98);
  backdrop-filter:blur(16px)
}
.modern-nav__brand{display:inline-flex;align-items:center;gap:10px;font-size:1.02rem;font-weight:800;letter-spacing:.04em}
.modern-nav__brand-mark{
  position:relative;width:24px;height:24px;border-radius:8px;
  background:linear-gradient(145deg,var(--lime) 0 28%,var(--mint) 28% 54%,var(--lavender) 54% 78%,var(--peach) 78%);
  box-shadow:inset 0 0 0 1px rgba(32,33,36,.09);transform:rotate(7deg)
}
.modern-nav__brand-mark:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;right:4px;top:4px;background:#fff;border:1px solid rgba(32,33,36,.08)}
.desktop-nav{display:flex;align-items:center;justify-content:center;gap:5px}
.desktop-nav__item{position:relative}
.desktop-nav__trigger,.desktop-nav__direct{
  min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 13px;border:0;border-radius:999px;
  background:transparent;color:#515255;font-size:.84rem;font-weight:650;
  transition:background .2s ease,color .2s ease
}
.desktop-nav__trigger svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s ease}
.desktop-nav__trigger:hover,.desktop-nav__direct:hover,.desktop-nav__item.is-open .desktop-nav__trigger{background:rgba(32,33,36,.055);color:var(--graphite)}
.desktop-nav__item.is-open .desktop-nav__trigger svg{transform:rotate(180deg)}
.modern-nav__cta{min-height:48px;min-width:145px;padding-inline:18px}
.mega-menu{
  position:absolute;z-index:75;top:54px;left:50%;width:680px;display:grid;grid-template-columns:.8fr 1.2fr;gap:12px;
  padding:14px;border:1px solid rgba(32,33,36,.075);border-radius:26px;
  background:rgba(255,255,255,.97);box-shadow:0 30px 90px rgba(32,33,36,.15);backdrop-filter:blur(22px);
  opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,10px) scale(.985);
  transition:opacity .22s ease,transform .28s var(--ease),visibility .22s ease
}
.desktop-nav__item:hover>.mega-menu,.desktop-nav__item:focus-within>.mega-menu,.desktop-nav__item.is-open>.mega-menu{
  opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0) scale(1)
}
.mega-menu__intro{padding:23px;border-radius:20px;background:var(--graphite);color:#fff}
.mega-menu__intro span{display:block;margin-bottom:13px;color:rgba(255,255,255,.58);font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.mega-menu__intro h2{margin:0 0 12px;font-size:1.42rem;line-height:1.03;letter-spacing:-.04em}
.mega-menu__intro p{margin:0;color:rgba(255,255,255,.68);font-size:.76rem;line-height:1.55}
.mega-menu__links{display:grid;gap:6px;padding:4px}
.mega-link{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;min-height:70px;padding:10px;border-radius:17px;transition:background .2s ease,transform .2s ease}
.mega-link:hover{background:var(--gray);transform:translateX(2px)}
.mega-link__icon{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:var(--lime)}
.mega-link:nth-child(2) .mega-link__icon{background:var(--mint)}
.mega-link:nth-child(3) .mega-link__icon{background:var(--lavender)}
.mega-link:nth-child(4) .mega-link__icon{background:var(--peach)}
.mega-link__icon svg{width:22px;height:22px;fill:none;stroke:var(--graphite);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mega-link strong{display:block;font-size:.78rem}
.mega-link small{display:block;margin-top:4px;color:var(--muted);font-size:.66rem;line-height:1.35}
.modern-menu-toggle{display:none;width:48px;height:48px;border:0;border-radius:50%;background:var(--gray);align-content:center;justify-items:center;gap:4px}
.modern-menu-toggle span{display:block;width:20px;height:2px;background:var(--graphite);border-radius:999px}
.modern-menu-toggle span:nth-child(2){width:14px;justify-self:end}

/* Mobile menu */
.mobile-menu{position:fixed;inset:0;z-index:100;visibility:hidden;pointer-events:none;opacity:0;transition:.22s ease}
.mobile-menu.is-open{visibility:visible;pointer-events:auto;opacity:1}
.mobile-menu__backdrop{position:absolute;inset:0;background:rgba(32,33,36,.24);backdrop-filter:blur(6px)}
.mobile-menu__panel{
  position:absolute;right:12px;top:12px;bottom:12px;width:min(460px,calc(100vw - 24px));
  display:flex;flex-direction:column;overflow:hidden;border-radius:32px;background:#fff;
  border:1px solid rgba(32,33,36,.08);box-shadow:0 36px 100px rgba(32,33,36,.2)
}
.mobile-menu__top{display:flex;align-items:center;justify-content:space-between;padding:18px}
.mobile-menu__close{width:44px;height:44px;border:0;border-radius:50%;background:var(--gray);position:relative}
.mobile-menu__close:before,.mobile-menu__close:after{content:"";position:absolute;left:12px;right:12px;top:21px;height:2px;background:var(--graphite)}
.mobile-menu__close:before{transform:rotate(45deg)}.mobile-menu__close:after{transform:rotate(-45deg)}
.mobile-menu__body{flex:1;overflow:auto;padding:6px 18px 18px}
.mobile-menu__intro{padding:20px;border-radius:22px;background:var(--graphite);color:#fff;margin-bottom:12px}
.mobile-menu__intro small{color:rgba(255,255,255,.55);font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.mobile-menu__intro p{margin:10px 0 0;color:rgba(255,255,255,.72);font-size:.82rem;line-height:1.5}
.mobile-menu__body a{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);font-size:.86rem;font-weight:750}
.mobile-menu__footer{padding:16px 18px 20px}.mobile-menu__footer .btn{width:100%}

/* Hero */
.hero{min-height:100svh;padding:156px 0 84px;display:grid;align-items:center;position:relative;isolation:isolate;overflow:hidden}
.hero:before{
  content:"";position:absolute;inset:0;z-index:-3;
  background:
    radial-gradient(circle at 86% 20%,rgba(153,254,237,.56),transparent 26%),
    radial-gradient(circle at 85% 73%,rgba(217,214,253,.66),transparent 31%),
    radial-gradient(circle at 58% 95%,rgba(255,189,155,.30),transparent 24%)
}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(500px,1fr);align-items:center;gap:52px}
.hero-title{margin:0;max-width:800px;font-size:clamp(4rem,7.1vw,7.4rem);line-height:.89;letter-spacing:-.075em;font-weight:800}
.hero-title .highlight{display:inline-block;position:relative;z-index:1}
.hero-title .highlight:after{content:"";position:absolute;left:-5px;right:-9px;bottom:5px;height:.28em;z-index:-1;border-radius:999px;background:var(--lime);transform:rotate(-1.2deg)}
.hero-statement{margin:28px 0 0;max-width:700px;font-size:clamp(1.18rem,1.7vw,1.58rem);line-height:1.4;font-weight:500;letter-spacing:-.025em}
.hero-copy{margin:20px 0 0;max-width:650px;color:var(--muted);font-size:clamp(1rem,1.2vw,1.13rem);line-height:1.7}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
.hero-note{margin-top:24px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.hero-note i{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 5px rgba(194,255,2,.14)}

/* Hero procurement visual */
.procurement-visual{position:relative;min-height:640px;isolation:isolate}
.procurement-visual:before{
  content:"";position:absolute;inset:3% 0 0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.84) 0 22%,rgba(153,254,237,.20) 42%,rgba(217,214,253,.20) 61%,transparent 69%);
  filter:blur(4px);z-index:-2
}
.network-stage{position:absolute;inset:0}
.network-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.network-path{fill:none;stroke:rgba(32,33,36,.16);stroke-width:1.6;stroke-dasharray:5 7}
.network-path--strong{stroke:rgba(32,33,36,.32);stroke-width:2}
.flow-dot{fill:var(--lime);filter:drop-shadow(0 0 7px rgba(194,255,2,.7))}
.flow-dot.mint{fill:var(--mint)}.flow-dot.peach{fill:var(--peach)}.flow-dot.lav{fill:var(--lavender)}
.system-node{
  position:absolute;min-width:128px;min-height:66px;display:flex;align-items:center;justify-content:center;
  padding:12px 16px;border:1px solid rgba(32,33,36,.09);border-radius:18px;background:rgba(255,255,255,.90);
  box-shadow:0 12px 30px rgba(32,33,36,.07);backdrop-filter:blur(12px);
  font-size:.75rem;font-weight:800;letter-spacing:-.02em;animation:nodeFloat 5.2s ease-in-out infinite
}
.system-node small{display:block;margin-top:3px;color:var(--muted);font-size:.52rem;font-weight:700;letter-spacing:.04em}
.system-node--coupa{left:2%;top:11%}.system-node--ariba{left:0;top:36%;animation-delay:-1s}.system-node--jaggaer{left:5%;bottom:18%;animation-delay:-2s}
.system-node--oracle{right:2%;top:10%;animation-delay:-.7s}.system-node--workday{right:0;top:37%;animation-delay:-1.6s}.system-node--shopify{right:4%;bottom:17%;animation-delay:-2.8s}
@keyframes nodeFloat{50%{transform:translateY(-7px)}}
.punchout-core{
  position:absolute;left:50%;top:49%;width:238px;height:238px;transform:translate(-50%,-50%);
  display:grid;place-items:center;text-align:center;padding:28px;border-radius:50%;background:var(--graphite);color:#fff;
  box-shadow:0 30px 70px rgba(32,33,36,.22),0 0 0 16px rgba(255,255,255,.4)
}
.punchout-core:before,.punchout-core:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(32,33,36,.12)}
.punchout-core:before{inset:-43px;animation:orbitSpin 13s linear infinite}.punchout-core:after{inset:-86px;border-style:dashed;animation:orbitSpin 18s linear infinite reverse}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
.punchout-core small{display:block;color:rgba(255,255,255,.53);font-size:.56rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.punchout-core strong{display:block;margin-top:7px;font-size:1.22rem;line-height:1.15}
.punchout-core span{display:block;margin-top:9px;color:rgba(255,255,255,.65);font-size:.66rem;line-height:1.45}
.protocol-pill{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.protocol-pill--top{top:7%}.protocol-pill--bottom{bottom:8%}
.protocol-pill b{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;background:#fff;border:1px solid rgba(32,33,36,.09);box-shadow:0 10px 22px rgba(32,33,36,.05);font-size:.64rem}
.protocol-pill b:first-child{background:var(--mint)}.protocol-pill b:last-child{background:var(--lavender)}

/* Credibility */
.credibility{padding:24px 0 18px}
.credibility-copy{display:flex;align-items:end;justify-content:space-between;gap:32px;padding:0 4px 22px}
.credibility-copy h2{margin:0;max-width:650px;font-size:clamp(1.75rem,3vw,2.9rem);line-height:1.04;letter-spacing:-.05em}
.credibility-copy p{margin:0;max-width:610px;color:var(--muted);font-size:.86rem;line-height:1.62}
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.trust-card{min-height:84px;display:grid;grid-template-columns:66px 1fr;align-items:center;gap:13px;padding:13px 16px;border:1px solid rgba(32,33,36,.10);border-radius:16px;background:rgba(255,255,255,.88)}
.trust-logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--gray);font-size:.7rem;font-weight:900}
.trust-card:nth-child(1) .trust-logo{background:#efffd0}.trust-card:nth-child(2) .trust-logo{background:#edf0ff}.trust-card:nth-child(3) .trust-logo{background:#eafff8}.trust-card:nth-child(4) .trust-logo{background:#fff0e8}
.trust-card small{display:block;color:var(--muted);font-size:.5rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.trust-card strong{display:block;margin-top:4px;font-size:.72rem}

/* Sticky page nav */
.page-nav-wrap{position:sticky;z-index:60;top:84px;padding:7px 0 12px}
.page-nav-shell{width:100%;min-height:52px;padding:6px 8px 6px 17px;border:1px solid rgba(32,33,36,.08);border-radius:999px;background:rgba(255,255,255,.91);box-shadow:0 12px 34px rgba(32,33,36,.07);backdrop-filter:blur(16px)}
.page-nav{display:flex;align-items:center;gap:3px;overflow-x:auto;scrollbar-width:none}.page-nav::-webkit-scrollbar{display:none}
.page-nav a{flex:0 0 auto;min-height:38px;display:inline-flex;align-items:center;padding:0 13px;border-radius:999px;color:var(--muted);font-size:.68rem;font-weight:750;white-space:nowrap}
.page-nav a:hover,.page-nav a.is-active{color:var(--graphite);background:var(--gray)}
.page-nav__cta{margin-left:auto!important;color:var(--graphite)!important;background:var(--lime)!important}
.page-nav-toggle{display:none}
[id]{scroll-margin-top:158px}

/* Problem */
.problem{overflow:hidden;background:linear-gradient(180deg,#fff 0%,#fbfbf8 100%)}
.problem-simple{max-width:1080px;margin:0 auto;text-align:center}
.problem-simple .section-title{max-width:970px;margin-inline:auto}
.problem-simple .section-copy{max-width:760px;margin-inline:auto}
.problem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px;text-align:left}
.problem-card{min-height:185px;padding:23px;border:1px solid var(--line);border-radius:24px;background:#fff;position:relative;overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.problem-card:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(32,33,36,.08)}
.problem-card:before{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-36px;top:-42px;background:var(--mint);opacity:.24;transition:transform .45s var(--ease)}
.problem-card:nth-child(2):before{background:var(--lavender)}.problem-card:nth-child(3):before{background:var(--peach)}.problem-card:nth-child(4):before{background:var(--lime)}
.problem-card:hover:before{transform:scale(1.2)}
.problem-card span{display:block;color:var(--muted);font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.problem-card strong{display:block;margin-top:42px;font-size:1.05rem;line-height:1.35;letter-spacing:-.025em}
.problem-question{margin:36px auto 0;max-width:860px;font-size:clamp(1.5rem,2.7vw,2.7rem);line-height:1.15;letter-spacing:-.045em;font-weight:800}
.problem-question em{font-style:normal;box-shadow:inset 0 -.28em 0 var(--lime)}

/* Connection matrix */
.connection-section{background:var(--gray)}
.connection-layout{display:grid;grid-template-columns:.84fr 1.16fr;gap:64px;align-items:center}
.connection-board{position:relative;padding:20px;border:1px solid rgba(32,33,36,.08);border-radius:38px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.connection-board__head{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:7px 7px 20px}
.connection-board__head strong{font-size:.92rem}.connection-board__head span{padding:7px 10px;border-radius:999px;background:var(--mint);font-size:.59rem;font-weight:800}
.connection-lanes{display:grid;grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr);gap:11px;align-items:stretch}
.system-stack{display:grid;gap:9px;min-width:0}
.system-chip{min-height:68px;display:grid;grid-template-columns:minmax(0,1fr) 26px;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--line);border-radius:16px;background:var(--gray);transition:transform .25s var(--ease),background .25s ease}
.system-stack:last-child .system-chip{grid-template-columns:26px minmax(0,1fr)}
.system-chip:hover{transform:translateX(3px);background:#fff}
.system-stack:last-child .system-chip:hover{transform:translateX(-3px)}
.system-chip>span{display:block;min-width:0}
.system-chip>b{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-size:.72rem;font-weight:600;line-height:1}
.system-chip strong{display:block;font-size:.7rem;line-height:1.28;overflow-wrap:break-word}
.system-chip small{display:block;margin-top:4px;color:var(--muted);font-size:.51rem;line-height:1.35;overflow-wrap:break-word}
.gateway-lane{display:flex;align-items:center;justify-content:center;position:relative}
.gateway-rail{width:4px;height:86%;border-radius:999px;background:linear-gradient(var(--lavender),var(--mint),var(--lime),var(--peach));position:relative}
.gateway-rail:before,.gateway-rail:after{content:"";position:absolute;left:50%;width:16px;height:16px;transform:translateX(-50%);border-radius:50%;background:#fff;border:4px solid var(--graphite)}
.gateway-rail:before{top:4%}.gateway-rail:after{bottom:4%}
.gateway-runner{position:absolute;left:50%;width:13px;height:13px;border-radius:50%;background:var(--lime);transform:translateX(-50%);box-shadow:0 0 0 5px rgba(194,255,2,.18);animation:railRun 4.3s ease-in-out infinite}
@keyframes railRun{0%,100%{top:10%}50%{top:84%}}
.connection-protocols{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.connection-protocols span{padding:8px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:.58rem;font-weight:800}

/* Capabilities */
.capabilities-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:48px}
.cap-card{
  min-height:320px;padding:28px;border-radius:var(--radius-lg);border:1px solid rgba(32,33,36,.07);
  background:#fff;position:relative;overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s var(--ease)
}
.cap-card:hover{transform:translateY(-7px);box-shadow:var(--shadow)}
.cap-card:nth-child(1),.cap-card:nth-child(4){grid-column:span 7}
.cap-card:nth-child(2),.cap-card:nth-child(3){grid-column:span 5}
.cap-card:nth-child(5),.cap-card:nth-child(6){grid-column:span 6}
.cap-card--mint{background:linear-gradient(145deg,#fff,#eafff9)}
.cap-card--lav{background:linear-gradient(145deg,#fff,#f0edff)}
.cap-card--peach{background:linear-gradient(145deg,#fff,#fff0e8)}
.cap-card--lime{background:linear-gradient(145deg,#fff,#f4ffd9)}
.cap-kicker{display:block;color:var(--muted);font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.cap-card h3{margin:20px 0 10px;font-size:1.65rem;letter-spacing:-.04em}
.cap-card p{margin:0;max-width:520px;color:var(--muted);line-height:1.62}
.mini-ui{margin-top:30px;padding:14px;border-radius:20px;background:rgba(255,255,255,.82);border:1px solid rgba(32,33,36,.08);box-shadow:0 14px 34px rgba(32,33,36,.05)}
.mini-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:11px;min-height:48px;padding:5px 7px;border-bottom:1px solid rgba(32,33,36,.07)}
.mini-row:last-child{border-bottom:0}
.mini-dot{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:var(--mint);font-size:.57rem;font-weight:900}
.mini-row:nth-child(2) .mini-dot{background:var(--lavender)}.mini-row:nth-child(3) .mini-dot{background:var(--peach)}
.mini-row strong{font-size:.67rem}.mini-row small{display:block;margin-top:3px;color:var(--muted);font-size:.54rem}
.mini-state{padding:6px 8px;border-radius:999px;background:#eafff2;color:#34704d;font-size:.52rem;font-weight:800}
.trace-ui{display:grid;gap:9px;margin-top:29px}
.trace-step{display:grid;grid-template-columns:13px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.82);border:1px solid rgba(32,33,36,.07)}
.trace-step i{width:10px;height:10px;border-radius:50%;background:#54c88b;box-shadow:0 0 0 4px rgba(84,200,139,.13)}
.trace-step.warn i{background:#ffb168;box-shadow:0 0 0 4px rgba(255,177,104,.14)}
.trace-step strong{font-size:.64rem}.trace-step span{color:var(--muted);font-size:.52rem}
.trace-step b{font-size:.52rem}

/* Journey */
.journey-wrap{border-radius:48px;padding:78px 54px;background:var(--graphite);color:#fff;overflow:hidden;position:relative}
.journey-wrap:before{content:"";position:absolute;right:-8%;top:-28%;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(153,254,237,.14),transparent 66%)}
.journey-wrap .eyebrow,.journey-wrap .section-copy{color:rgba(255,255,255,.64)}
.journey-flow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:46px;position:relative}
.journey-step{min-height:220px;padding:18px;border-radius:21px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);display:flex;flex-direction:column;justify-content:space-between;position:relative;transition:background .35s ease,transform .35s var(--ease),border-color .35s ease}
.journey-step.is-active{background:rgba(194,255,2,.12);border-color:rgba(194,255,2,.5);transform:translateY(-6px)}
.journey-no{width:33px;height:33px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.11);font-size:.66rem;font-weight:900}
.journey-step.is-active .journey-no{background:var(--lime);color:var(--graphite)}
.journey-step h3{margin:0 0 7px;font-size:.92rem}.journey-step p{margin:0;color:rgba(255,255,255,.62);font-size:.72rem;line-height:1.48}
.journey-progress{margin-top:24px;height:8px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
.journey-progress span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--lime),var(--mint),var(--lavender),var(--peach));transition:width .6s var(--ease)}
.journey-footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:18px;color:rgba(255,255,255,.62);font-size:.68rem}
.journey-replay{border:1px solid rgba(255,255,255,.18);border-radius:999px;background:transparent;color:#fff;padding:8px 12px;font-size:.65rem;font-weight:800}

/* Implementation process */
.onboarding-layout{display:grid;grid-template-columns:.92fr 1.08fr;gap:70px;align-items:center}
.onboarding-panel{padding:18px;border-radius:38px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.onboarding-head{padding:10px 10px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.onboarding-head strong{font-size:.92rem}.onboarding-head span{padding:7px 10px;border-radius:999px;background:var(--lime);font-size:.58rem;font-weight:800}
.onboarding-step{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:13px;padding:17px 10px;border-top:1px solid var(--line)}
.onboarding-step b{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:var(--graphite);color:#fff;font-size:.62rem}
.onboarding-step strong{display:block;font-size:.75rem}.onboarding-step small{display:block;margin-top:4px;color:var(--muted);font-size:.58rem;line-height:1.4}
.onboarding-step i{width:11px;height:11px;border-radius:50%;background:#4fc58a;box-shadow:0 0 0 4px rgba(79,197,138,.12)}

/* Visibility */
.visibility-section{background:radial-gradient(circle at 13% 24%,rgba(153,254,237,.37),transparent 25%),radial-gradient(circle at 88% 76%,rgba(217,214,253,.48),transparent 28%),var(--gray)}
.visibility-layout{display:grid;grid-template-columns:1.13fr .87fr;gap:66px;align-items:center}
.dashboard{padding:17px;border-radius:38px;background:rgba(255,255,255,.88);border:1px solid rgba(32,33,36,.08);box-shadow:var(--shadow)}
.dashboard-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 9px 18px}
.dashboard-top strong{font-size:.88rem}.dashboard-status{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:#eafff2;color:#34704d;font-size:.56rem;font-weight:800}
.dashboard-status:before{content:"";width:7px;height:7px;border-radius:50%;background:#4fc58a}
.dashboard-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.metric{padding:13px;border-radius:15px;background:var(--gray)}.metric small{display:block;color:var(--muted);font-size:.49rem}.metric strong{display:block;margin-top:5px;font-size:.88rem}
.dashboard-table{border:1px solid var(--line);border-radius:19px;overflow:hidden;background:#fff}
.table-row{display:grid;grid-template-columns:1.15fr 1fr .9fr .72fr .72fr;gap:8px;align-items:center;min-height:52px;padding:0 13px;border-bottom:1px solid var(--line);font-size:.58rem}
.table-row:last-child{border-bottom:0}.table-row--head{min-height:38px;background:var(--gray);color:var(--muted);font-size:.49rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.state-ok{color:#34704d;font-weight:800}.state-pending{color:#9b672e;font-weight:800}
.issue-card{margin-top:10px;padding:15px;border-radius:18px;background:var(--graphite);color:#fff}
.issue-card__head{display:flex;justify-content:space-between;gap:12px}.issue-card__head span{color:rgba(255,255,255,.55);font-size:.53rem}
.issue-card strong{font-size:.72rem}.issue-card p{margin:7px 0 0;color:rgba(255,255,255,.65);font-size:.58rem;line-height:1.45}

/* Deployment */
.deployment-card{min-height:560px;display:grid;grid-template-columns:1.02fr .98fr;align-items:center;gap:40px;padding:62px;border:1px solid rgba(32,33,36,.075);border-radius:44px;background:radial-gradient(circle at 88% 10%,rgba(255,255,255,.92),transparent 24%),linear-gradient(140deg,#f3f0ff 0%,#ebfff9 54%,#fff3ea 100%);box-shadow:0 28px 74px rgba(32,33,36,.08);overflow:hidden}
.deployment-card .section-title{font-size:clamp(3rem,5.5vw,5.8rem)}
.deploy-benefits{display:flex;flex-wrap:wrap;gap:8px;margin-top:25px}.deploy-benefits span{display:inline-flex;min-height:34px;align-items:center;padding:0 11px;border-radius:999px;font-size:.61rem;font-weight:800;background:rgba(255,255,255,.8);border:1px solid rgba(32,33,36,.07)}
.deploy-visual{min-height:385px;position:relative}
.deploy-core{position:absolute;left:50%;top:50%;width:164px;height:164px;display:grid;place-items:center;align-content:center;padding:22px;transform:translate(-50%,-50%);border-radius:50%;background:var(--graphite);color:#fff;text-align:center;box-shadow:0 24px 55px rgba(32,33,36,.2)}
.deploy-core small{color:rgba(255,255,255,.55);font-size:.54rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.deploy-core strong{margin-top:7px;font-size:1rem;line-height:1.2}
.deploy-orbit{position:absolute;border:1px solid rgba(32,33,36,.12);border-radius:50%}.deploy-orbit.one{inset:6%}.deploy-orbit.two{inset:20%;border-style:dashed}
.deploy-chip{position:absolute;min-width:96px;min-height:42px;display:grid;place-items:center;padding:0 12px;border-radius:999px;background:#fff;border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 30px rgba(32,33,36,.09);font-size:.61rem;font-weight:800;animation:nodeFloat 5s ease-in-out infinite}
.deploy-chip.c1{left:1%;top:22%;background:#f0edff}.deploy-chip.c2{right:3%;top:15%;background:#efffd0;animation-delay:-1s}.deploy-chip.c3{right:0;bottom:22%;background:#fff0e7;animation-delay:-2s}.deploy-chip.c4{left:5%;bottom:15%;background:#e9fff9;animation-delay:-3s}.deploy-chip.c5{left:39%;top:0;animation-delay:-4s}.deploy-chip.c6{left:36%;bottom:0;animation-delay:-2.4s}

/* Proof */
.proof-section{background:var(--gray)}
.proof-grid{display:grid;grid-template-columns:1.18fr .82fr .82fr;gap:16px;margin-top:42px}
.proof-card{min-height:340px;padding:30px;border-radius:var(--radius-lg);background:#fff;border:1px solid rgba(32,33,36,.07);position:relative;overflow:hidden}
.proof-card:first-child{background:linear-gradient(145deg,#fff,#ecfff9)}
.proof-card:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;right:-70px;top:-70px;background:var(--lime);opacity:.15}
.proof-kicker{display:inline-block;margin-bottom:64px;color:var(--muted);font-size:.65rem;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
.proof-big{display:block;margin-bottom:12px;font-size:clamp(3.3rem,5.4vw,5.6rem);line-height:.9;letter-spacing:-.06em;font-weight:800}
.proof-card h3{margin:0 0 11px;font-size:1.3rem;letter-spacing:-.035em}.proof-card p{margin:0;color:var(--muted);line-height:1.6}

/* Industry strip */
.industry-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:34px}
.industry-pill{min-height:92px;display:flex;align-items:flex-end;padding:16px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:.68rem;font-weight:800;position:relative;overflow:hidden}
.industry-pill:before{content:"";position:absolute;left:14px;top:14px;width:21px;height:21px;border-radius:7px;background:var(--lime);transform:rotate(-7deg)}
.industry-pill:nth-child(2):before,.industry-pill:nth-child(5):before{background:var(--mint)}.industry-pill:nth-child(3):before{background:var(--lavender)}.industry-pill:nth-child(4):before,.industry-pill:nth-child(6):before{background:var(--peach)}

/* FAQ */
.faq{max-width:920px;margin-top:34px}.faq details{padding:22px 0;border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:1.02rem;font-weight:800;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}.faq summary:after{content:"+";font-size:1.45rem;font-weight:400;color:#8b8c90}.faq details[open] summary:after{content:"−"}
.faq p{max-width:790px;margin:14px 0 0;color:var(--muted);line-height:1.7}

/* Contact */
.contact-section{background:radial-gradient(circle at 12% 20%,rgba(194,255,2,.25),transparent 22%),radial-gradient(circle at 88% 18%,rgba(153,254,237,.36),transparent 26%),radial-gradient(circle at 80% 82%,rgba(217,214,253,.44),transparent 28%),var(--gray)}
.form-layout{display:grid;grid-template-columns:.82fr 1.18fr;gap:60px;align-items:start}
.form-card{padding:31px;border-radius:var(--radius-lg);background:#fff;border:1px solid rgba(32,33,36,.08);box-shadow:var(--shadow)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:8px}.field.full{grid-column:1/-1}
label{font-size:.75rem;font-weight:800}input,select,textarea{width:100%;border:1px solid #dbddd8;border-radius:14px;background:#fff;color:var(--graphite);outline:none}
input,select{height:52px;padding:0 14px}textarea{min-height:138px;padding:13px 14px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#95bf00;box-shadow:0 0 0 4px rgba(194,255,2,.18)}.form-note{margin:14px 0 0;color:var(--muted);font-size:.7rem;line-height:1.55}

/* Footer */
.site-footer{padding:72px 0 28px;background:#F5F5F3;border-top:1px solid var(--line)}
.footer-grid{display:grid;grid-template-columns:1.5fr repeat(5,1fr);gap:34px}
.footer-brand strong{font-size:1.1rem;letter-spacing:.04em}.footer-brand p{max-width:260px;margin:14px 0 0;color:var(--muted);line-height:1.6;font-size:.82rem}
.footer-col h4{margin:0 0 16px;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:#858689}.footer-col a{display:block;margin:9px 0;color:#4e4f52;font-size:.77rem;line-height:1.45}.footer-col a:hover{color:#000}
.footer-bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:52px;padding-top:22px;border-top:1px solid var(--line);color:#858689;font-size:.7rem}

[data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
[data-reveal].is-visible{opacity:1;transform:none}

@media(max-width:1180px){
  :root{--page:min(100% - 32px,1060px)}
  .hero-grid,.connection-layout,.onboarding-layout,.visibility-layout,.form-layout{grid-template-columns:1fr}
  .hero{min-height:auto}.procurement-visual{max-width:760px;width:100%;margin-inline:auto}
  .problem-grid{grid-template-columns:repeat(2,1fr)}
  .journey-flow{grid-template-columns:repeat(3,1fr)}
  .proof-grid{grid-template-columns:1fr 1fr}.proof-card:first-child{grid-column:1/-1}
  .industry-strip{grid-template-columns:repeat(3,1fr)}
  .footer-grid{grid-template-columns:1.4fr repeat(3,1fr)}
}
@media(max-width:920px){
  .desktop-nav,.modern-nav__cta{display:none}.modern-menu-toggle{display:grid}.modern-nav{grid-template-columns:auto auto;justify-content:space-between}
  .connection-lanes{grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr);gap:9px}
  .system-chip{min-height:70px;padding:10px 11px;gap:8px}
  .system-chip strong{font-size:.66rem}.system-chip small{font-size:.48rem}
  .site-header{padding:12px 0}.hero{padding-top:132px}.section{padding:94px 0}
  .trust-grid{grid-template-columns:1fr 1fr}
  .cap-card:nth-child(n){grid-column:span 6}
  .journey-flow{grid-template-columns:repeat(2,1fr)}
  .deployment-card{grid-template-columns:1fr;padding:48px}.deploy-visual{min-height:320px}
  .footer-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:680px){
  :root{--page:calc(100vw - 24px)}
  .section{padding:76px 0}.section--tight{padding:56px 0}
  .hero{padding:118px 0 56px}.hero-title{font-size:clamp(3.55rem,17vw,5.2rem)}.hero-actions{display:grid}.btn{width:100%}
  .procurement-visual{min-height:500px}
  .punchout-core{width:176px;height:176px;padding:20px}.punchout-core:before{inset:-28px}.punchout-core:after{inset:-54px}.punchout-core strong{font-size:.94rem}
  .system-node{min-width:93px;min-height:54px;padding:8px 9px;border-radius:14px;font-size:.59rem;backdrop-filter:none}.system-node small{font-size:.44rem}
  .protocol-pill b{min-height:29px;padding:0 9px;font-size:.54rem}
  .credibility-copy{display:block}.credibility-copy p{margin-top:13px}.trust-grid{grid-template-columns:1fr 1fr}.trust-card{grid-template-columns:44px 1fr;padding:11px}.trust-logo{width:38px;height:38px}
  .page-nav-wrap{top:70px;padding:6px 0 8px}.page-nav-shell{padding:0;border-radius:20px;overflow:hidden;backdrop-filter:none}
  .page-nav-toggle{width:100%;min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px;border:0;background:transparent;text-align:left}
  .page-nav-toggle small,.page-nav-toggle strong{display:block}.page-nav-toggle small{color:var(--muted);font-size:.52rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.page-nav-toggle strong{margin-top:2px;font-size:.73rem}
  .page-nav{display:none;padding:0 7px 7px}.page-nav-shell.is-open .page-nav{display:grid}.page-nav a{width:100%;min-height:40px;border-radius:12px}.page-nav__cta{margin-left:0!important;margin-top:3px;justify-content:center}
  .problem-grid,.capabilities-grid,.journey-flow,.proof-grid,.industry-strip,.fields{grid-template-columns:1fr}
  .problem-card{min-height:150px}.problem-card strong{margin-top:30px}
  .cap-card:nth-child(n){grid-column:1/-1;min-height:0}
  .connection-board{padding:13px;border-radius:28px}.connection-lanes{grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:7px}.system-chip{min-height:62px;padding:9px 8px;gap:6px;grid-template-columns:minmax(0,1fr) 22px}.system-stack:last-child .system-chip{grid-template-columns:22px minmax(0,1fr)}.system-chip>b{width:22px;height:22px;font-size:.62rem}.system-chip strong{font-size:.58rem}.system-chip small{display:none}
  .journey-wrap{padding:54px 20px;border-radius:34px}.journey-step{min-height:170px}
  .dashboard-metrics{grid-template-columns:1fr 1fr}.table-row{grid-template-columns:1.2fr .9fr .72fr}.table-row>*:nth-child(4),.table-row>*:nth-child(5){display:none}
  .deployment-card{padding:38px 23px 24px;border-radius:30px}.deploy-visual{min-height:300px}.deploy-core{width:138px;height:138px}.deploy-chip{min-width:76px;font-size:.53rem}
  .proof-card:first-child{grid-column:auto}.footer-grid{grid-template-columns:1fr}.footer-bottom{flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
#problem,#connect,#capabilities,#journey,#onboarding,#visibility,#deployment,#proof,#faq,#contact,.site-footer{content-visibility:auto;contain-intrinsic-size:850px}

/* =========================
   READABILITY + SHARED PAGE ENDING
   ========================= */

/* Main reading hierarchy: lighter than the first PunchOut draft.
   Small utility labels stay stronger where needed, but large copy no longer feels heavy. */
body{font-weight:400}
.eyebrow{font-weight:600}
.hero-title,
.section-title{font-weight:700}
.hero-statement{font-weight:500}
.hero-copy,
.section-copy{font-weight:400}

.btn{font-weight:600}
.desktop-nav__trigger,
.desktop-nav__direct{font-weight:600}
.modern-nav__brand{font-weight:700}
.page-nav a{font-weight:600}

.credibility-copy h2,
.problem-question,
.cap-card h3,
.journey-step h3,
.proof-card h3,
.standard-final-cta__copy h2{font-weight:700}

.problem-card strong,
.system-node,
.trust-card strong,
.system-chip strong,
.onboarding-step strong,
.dashboard-top strong,
.issue-card strong,
.faq summary{font-weight:650}

.problem-card span,
.cap-kicker,
.proof-kicker,
.footer-col h4,
.onboarding-head span,
.connection-board__head span{font-weight:700}

/* Shared Swishtag pre-footer CTA.
   This is intentionally simple so every solution / platform / industry page can close the same way. */
.standard-final-cta{
  padding:104px 0;
  background:#fff;
}
.standard-final-cta__inner{
  min-height:390px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:48px;
  padding:58px 62px;
  border:1px solid rgba(32,33,36,.08);
  border-radius:44px;
  overflow:hidden;
  position:relative;
  isolation:isolate;
  background:
    radial-gradient(circle at 88% 18%,rgba(153,254,237,.48),transparent 26%),
    radial-gradient(circle at 71% 94%,rgba(217,214,253,.48),transparent 30%),
    radial-gradient(circle at 8% 10%,rgba(194,255,2,.20),transparent 22%),
    linear-gradient(145deg,#fbfbf8,#fff);
}
.standard-final-cta__inner:before{
  content:"";
  position:absolute;
  z-index:-1;
  width:320px;
  height:320px;
  right:-110px;
  top:-120px;
  border-radius:50%;
  border:1px solid rgba(32,33,36,.09);
